<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil — DC's Transportes LTDA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<div class="app-container">
    <div id="sidebar-placeholder"></div>
    <div class="content-area">
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="ph ph-list"></i></button>
                <h1>Meu Perfil</h1>
            </div>
            <a href="profile.html" class="user-profile">
                <div class="avatar" id="top-bar-avatar"><i class="ph ph-user"></i></div>
                <span class="user-name" id="top-bar-name">Motorista</span>
            </a>
        </div>
        <div class="page-content">
            <div class="profile-grid">
                <!-- Left: Avatar & Info -->
                <div>
                    <div class="profile-card" style="margin-bottom:1rem;">
                        <div class="profile-avatar-wrap" id="avatar-wrap" title="Clique para alterar">
                            <i class="ph ph-user" id="avatar-icon"></i>
                            <div class="overlay"><i class="ph ph-camera"></i></div>
                        </div>
                        <input type="file" id="avatar-input" accept="image/*" style="display:none;">
                        <div class="profile-name" id="profile-name">Carregando...</div>
                        <div class="profile-email" id="profile-email"></div>
                        <span class="profile-role" id="profile-role">Motorista</span>

                        <div class="quota-bar-wrap" id="quota-wrap" style="display:none;">
                            <label>
                                <span>Meta mensal</span>
                                <span id="quota-label">0 / 0 km</span>
                            </label>
                            <div class="quota-bar"><div class="quota-fill" id="quota-fill" style="width:0%"></div></div>
                        </div>
                    </div>

                    <div class="card">
                        <h3 style="margin-bottom:1rem;font-size:0.95rem;">⚠️ Zona de Perigo</h3>
                        <button class="btn btn-danger btn-full" id="btn-delete-account">
                            <i class="ph ph-trash"></i> Excluir Minha Conta
                        </button>
                    </div>
                </div>

                <!-- Right: Edit Forms -->
                <div style="display:flex;flex-direction:column;gap:1rem;">
                    <div class="card">
                        <h3 style="margin-bottom:1.25rem;font-size:1rem;">✏️ Editar Dados</h3>
                        <form id="edit-form" style="display:flex;flex-direction:column;gap:1rem;">
                            <div class="form-group">
                                <label>Nome completo</label>
                                <input class="form-input" type="text" id="edit-name" placeholder="Seu nome" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input class="form-input" type="email" id="edit-email" disabled style="opacity:0.6;cursor:not-allowed;">
                            </div>
                            <div class="form-group">
                                <label>Cargo / Função</label>
                                <input class="form-input" type="text" id="edit-role" placeholder="Ex: Motorista" disabled style="opacity:0.6;cursor:not-allowed;" title="Apenas o Administrador pode alterar o cargo">
                            </div>
                            <button type="submit" class="btn btn-primary" id="btn-save-profile">
                                <i class="ph ph-floppy-disk"></i> Salvar Alterações
                            </button>
                        </form>
                    </div>

                    <div class="card" id="goal-card" style="display:none;">
                        <h3 style="margin-bottom:1.25rem;font-size:1rem;">🎯 Meta Mensal de KMs</h3>
                        <form id="goal-form" style="display:flex;gap:0.75rem;align-items:flex-end;">
                            <div class="form-group" style="flex:1;">
                                <label>Meta em km</label>
                                <input class="form-input" type="number" id="goal-input" placeholder="10000" min="0">
                            </div>
                            <button type="submit" class="btn btn-primary" id="btn-save-goal">Salvar</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3 style="margin-bottom:1.25rem;font-size:1rem;">🔑 Alterar Senha</h3>
                        <form id="pass-form" style="display:flex;flex-direction:column;gap:1rem;">
                            <div class="form-group">
                                <label>Senha atual</label>
                                <input class="form-input" type="password" id="pass-current" placeholder="••••••••" required>
                            </div>
                            <div class="form-group">
                                <label>Nova senha</label>
                                <input class="form-input" type="password" id="pass-new" placeholder="••••••••" required>
                            </div>
                            <div class="form-group">
                                <label>Confirmar nova senha</label>
                                <input class="form-input" type="password" id="pass-confirm" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-ghost">
                                <i class="ph ph-lock-key"></i> Alterar Senha
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script><script src="js/db.js"></script>
<script src="js/auth.js"></script><script src="js/utils.js"></script><script src="js/profile.js"></script>
</body></html>
